name: Claude Code

# Responds to @claude mentions on issues and PRs, and can be run manually with a
# prompt to advance the roadmap. Requires the Claude GitHub App installed and an
# ANTHROPIC_API_KEY repository secret.
#
# For a fully unattended loop, add a schedule trigger, for example:
#   schedule:
#     - cron: "0 4 * * *"
# and set the prompt to implement the next unchecked item in CLAUDE.md. Keep the
# test before commit gate and avoid letting the action re-trigger itself.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should Claude build or fix"
        required: true
        default: "Implement the next unchecked item in CLAUDE.md. Run npm test, then commit and open a PR."

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event.inputs.prompt }}
          claude_args: "--allowed-tools Read,Write,Edit,Bash"
